[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-rag"
version = "0.1.0"
description = "HR policy RAG assistant on Google Cloud (Cloud Run, Qdrant, Jina, Model Armor, LiteLLM, LangSmith)"
requires-python = ">=3.11"
dependencies = [
    "streamlit[auth]>=1.44",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tenacity>=8.5",
    "qdrant-client[fastembed]>=1.12",
    "litellm>=1.60",
    "google-auth>=2.30",
    "google-cloud-storage>=2.18",
    "google-cloud-modelarmor>=0.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "langsmith>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hr-rag-ingest = "hr_rag.ingestion.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
